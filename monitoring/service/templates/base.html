<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Incident log{% endblock %} · CRUX</title><link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}"><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body class="m-0 bg-paper font-sans text-sm leading-normal text-ink **:focus-visible:outline-3 **:focus-visible:outline-primary **:focus-visible:outline-offset-3"><header class="flex items-center justify-between gap-5 border-b border-line bg-white px-[18px] py-5 min-[701px]:px-10"><a class="text-[19px] font-bold tracking-[.04em] text-ink" href="/">CRUX <span class="ml-2.5 hidden text-[15px] font-normal tracking-normal text-muted min-[701px]:inline"> / incident log</span></a><nav aria-label="Account">
{% if g.actor %}<form action="/auth/logout" method="post"><input type="hidden" name="csrf" value="{{ g.csrf }}"><button class="cursor-pointer border-0 bg-transparent p-0 text-accent hover:underline">Sign out</button></form>
{% else %}<a class="inline-block cursor-pointer rounded border border-primary bg-primary px-3 py-1.5 text-[13px] text-white! no-underline! transition-colors hover:bg-[#1454cb] motion-reduce:transition-none" href="/auth/login">Sign in with AWS</a>{% endif %}</nav></header>
<main class="mx-auto min-h-[75vh] max-w-[1600px] px-[18px] pt-6 pb-5 min-[701px]:px-10">{% block content %}{% endblock %}</main><footer class="mx-auto max-w-[1600px] px-[18px] pt-4 pb-7 text-xs text-muted min-[701px]:px-10">Incident information is restricted to authorized All HAL members.</footer></body></html>
