orchestrator = "pi"
extensions = ["research_extensions.py"]

[runtime]
type = "openai-agents"
max_turns = "unlimited"
interactive_delegates = true

[runtime.model_provider]
type = "openai-compatible"
api = "responses"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
max_request_bytes = 20000000

[runtime.steering]
server = "slack"
channel_id = "{{SLACK_CHANNEL_ID}}"
after_ts = "{{SLACK_AFTER_TS}}"
poll_interval_seconds = 30

[context]
type = "compaction"
context_window_tokens = 1048576
trigger_tokens = 400000
keep_recent_items = 20
image_tokens = 1120  # Gemini 4 Carbon default for image inputs.

[budget]
max_wall_seconds = 518400
max_cost_usd = 30000  # Run allowance; the OpenRouter inference key has a $65,000 provider cap.

[resources.models]
type = "langfuse"
refresh_seconds = 30

[resources.gpu]
type = "runpod"
refresh_seconds = 30
limits = { cost_usd = 3000 }

[resources.experiments]
type = "openrouter-experiments"
refresh_seconds = 30

[loop]
type = "tabpfn_research"
reserve_wall_seconds = 51840  # 10% of the six-day run
reserve_fraction = 0.1
poll_seconds = 15

[[loop.phases]]
name = "research"
prompt = "PROMPT.md"
continue_prompt = "prompts/research-continue.md"
gates = ["research_review"]
max_iterations = "unlimited"

[[loop.phases]]
name = "finalize"
prompt = "prompts/finalize.md"
continue_prompt = "prompts/finalize-continue.md"
gates = ["final_review"]
max_iterations = "unlimited"

[gates.research_review]
type = "tabpfn_review"
rubric = "prompts/review.md"
blind = true
artifacts = { "submission.pdf" = "paper/paper.pdf" }
tools = ["read_file", "list_files", "read_pdf"]
max_turns = "unlimited"
models = ["google/gemini-4-carbon@preset/ai-studio-priority", "anthropic/claude-opus-5.5", "openai/gpt-6-astra"]

[gates.final_review]
type = "tabpfn_review"
rubric = "prompts/review.md"
blind = true
artifacts = { "submission.pdf" = "paper/paper.pdf" }
tools = ["read_file", "list_files", "read_pdf"]
max_turns = "unlimited"
final = true
models = ["google/gemini-4-carbon@preset/ai-studio-priority", "anthropic/claude-opus-5.5", "openai/gpt-6-astra"]

[agents.pi]
persona = "personas/pi.md"
context = ["workspace/AGENTS.md", "workspace/RESEARCH.md"]
workspace_context = ["REVIEW_HISTORY.md", "REVIEW_STATUS.json", "PLAN.md"]
workspace_context_max_chars = 120000
tools = ["run_shell", "read_file", "write_file", "list_files", "read_pdf", "budget_status", "rest", "escalate",
         "restart_context"]
mcp_servers = ["slack"]
delegates = [
    "research_assistant", "research_assistant_b", "research_assistant_c",
    "research_assistant_d", "research_assistant_e", "research_assistant_f",
    "worker_a", "worker_b", "worker_c", "worker_d", "worker_e", "worker_f", "worker_g", "worker_h", "worker_i", "worker_j",
    "worker_k", "worker_l", "worker_m", "worker_n", "worker_o", "worker_p", "worker_q", "worker_r", "worker_s", "worker_t",
]
max_turns = "unlimited"

[agents.research_assistant]
persona = "personas/ra.md"
description = "Research assistant for a self-contained literature, theory, implementation, or analysis brief. One outstanding conversation; steer or resume it with send_message."
context = ["workspace/AGENTS.md", "workspace/RESEARCH.md"]
workspace_context = ["PLAN.md"]
tools = ["run_shell", "read_file", "write_file", "list_files", "read_pdf", "budget_status", "rest"]
max_turns = "unlimited"

[agents.research_assistant_b]
persona = "personas/ra.md"
