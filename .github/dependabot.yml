# Weekly version groups; security rules exclude every dependency from grouping.
# Security updates use repository alerts immediately, independently of this schedule.
version: 2
updates:
- package-ecosystem: pip
  directories:
  - /
  - /devops
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: America/New_York
  open-pull-requests-limit: 5
  groups:
    python-tooling:
      applies-to: version-updates
      patterns:
      - '*'
    individual-security-updates:
      applies-to: security-updates
      patterns:
      - '*'
      exclude-patterns:
      - '*'
