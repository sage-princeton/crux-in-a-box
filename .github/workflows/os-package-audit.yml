name: Ubuntu package audit
on:
  schedule:
    - cron: '19 10 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['devops/apt/**', '.github/tools/trivy/**', '.github/workflows/os-package-audit.yml']
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install declared Trivy
        run: |
          docker build --output "type=local,dest=$RUNNER_TEMP/trivy" .github/tools/trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Install the production apt manifests in Ubuntu
        run: docker build --pull --no-cache -t crux-apt:audit -f devops/apt/Dockerfile .
      - name: Export SPDX and vulnerability reports
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          trivy image --format spdx-json --output "$RUNNER_TEMP/packages/ubuntu.spdx.json" crux-apt:audit
          trivy image --scanners vuln --format json --output "$RUNNER_TEMP/packages/ubuntu-vulnerabilities.json" crux-apt:audit
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed crux-apt:audit
      - name: Preserve package evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-package-audit
          path: ${{ runner.temp }}/packages/
          retention-days: 30
          if-no-files-found: error
