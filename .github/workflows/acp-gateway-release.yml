name: ACP gateway release

on:
  pull_request:
    paths:
      - 'src/ec2-workspaces/**'
      - 'tests/acp-gateway-release/**'
      - '.github/workflows/acp-gateway-release.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acp-gateway-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    name: Pinned gateway release matches its hash and fixes the verdict race
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python3 -m pip install -r tests/acp-gateway-release/requirements.txt
      - name: Run tests
        run: python3 -m pytest tests/acp-gateway-release -v
