name: SDK scaffold checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-scaffold-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Scaffold lint, behavior and demo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/sdk-scaffold
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt 'pytest>=8,<9' ruff==0.14.0
      - run: ruff check .
      - run: python -m pytest -q
      - name: Demo site tests
        run: python -m unittest discover -s examples/product-change/workspace/site
      - name: Lint the demo's Docker scripts
        run: shellcheck docker/*.sh

  demo-image:
    name: Demo image builds and checks the drop-in
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/sdk-scaffold
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build --tag crux-sdk-scaffold-demo --file docker/Dockerfile .
      - name: Stage and check the demo in the container (no model calls)
        run: >-
          docker run --rm --init -e SLACK_CHANNEL_ID=C0000000000 -e SLACK_BOT_TOKEN=xoxb-ci -e CRUX_MODEL=ci
          crux-sdk-scaffold-demo check
