<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Incident log{% endblock %} · CRUX</title><link rel="stylesheet" href="{{ url_for('static', filename='incidents.css') }}"></head>
<body><header><a class="brand" href="/">CRUX <span> / incident log</span></a><nav aria-label="Account">
{% if g.actor %}<form action="/auth/logout" method="post"><input type="hidden" name="csrf" value="{{ g.csrf }}"><button class="text-button">Sign out</button></form>
{% else %}<a class="button" href="/auth/login">Sign in with AWS</a>{% endif %}</nav></header>
<main>{% block content %}{% endblock %}</main><footer>Incident information is restricted to authorized All HAL members.</footer></body></html>
