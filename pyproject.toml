[tool.ruff]
target-version = "py312"
line-length = 120
include = ["pyproject.toml", "devops/**/*.py", "monitoring/service/**/*.py", "monitoring/tracing/codex/**/*.py", "scaffolds/**/*.py"]
src = ["monitoring/service", "scaffolds/sdk", "devops/ec2-workspaces", "devops/ec2-workspaces/tests"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["scaffolds/sdk/tests", "devops/ec2-workspaces/tests"]
pythonpath = [
    "scaffolds/sdk",
    "scaffolds/sdk/tests",
]
