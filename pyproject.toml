[tool.ruff]
target-version = "py312"
line-length = 120
include = ["pyproject.toml", "devops/**/*.py", "monitoring/service/**/*.py", "monitoring/tracing/codex/**/*.py", "monitoring/tracing/tests/**/*.py", "scaffolds/**/*.py"]
src = ["monitoring/service", "scaffolds/sdk", "devops/ec2-workspaces", "monitoring/tracing/tests", "devops/ec2-workspaces/tests"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["monitoring/service/tests", "scaffolds/sdk/tests", "monitoring/tracing/tests", "devops/ec2-workspaces/tests"]
pythonpath = [
    "monitoring/service",
    "scaffolds/sdk",
    "scaffolds/sdk/tests",
    "monitoring/tracing/tests",
]
